name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0 (leave empty to use the version in pubspec.yaml)"
        required: false
        type: string

# Nothing can write by default. Only the release job below gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.sign.outputs.apk }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter (stable channel, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare the Android project
        run: bash tool/prepare_android.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a version like v1.2.3" >&2
            exit 1
          fi
          # Android's build name must be plain numbers and dots.
          BUILD_NAME="$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ github.run_number }}

      - name: Sign and name the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)"
          IN="build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p dist
          OUT="dist/tally-${VERSION}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing with the release keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KS_PASS="$KEYSTORE_PASSWORD"
            export K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:K_PASS \
              --out "$OUT" "$IN"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "No signing secrets found: using debug signing."
            cp "$IN" "$OUT"
            # Flutter's default Android setup signs release builds with the
            # debug key. If this build is somehow unsigned, sign it with a
            # throwaway debug key so the APK still installs.
            if ! "$BUILD_TOOLS/apksigner" verify "$OUT" > /dev/null 2>&1; then
              keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$RUNNER_TEMP/debug.jks" --ks-key-alias androiddebugkey \
                --ks-pass pass:android --key-pass pass:android \
                --out "$OUT.signed" "$OUT"
              mv "$OUT.signed" "$OUT"
            fi
          fi

          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tally-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: tally-apk
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its APK."
            gh release upload "$TAG" dist/*.apk --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$REPO" \
              --target "$SHA" \
              --title "Tally $TAG" \
              --generate-notes
          fi
