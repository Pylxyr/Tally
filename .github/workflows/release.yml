name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0 (leave empty to use the version in pubspec.yaml)"
        required: false
        type: string

# Nothing can write by default. Only the release job below gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter (stable channel, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare the Android project
        run: bash tool/prepare_android.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a version like v1.2.3" >&2
            exit 1
          fi
          # Android's build name must be plain numbers and dots.
          BUILD_NAME="$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # One APK per CPU type instead of one fat APK holding all three: the app is
      # identical, but each file is roughly a third of the size. Debug symbols
      # are split out of the app (kept as a separate artifact below).
      - name: Build release APKs
        run: >
          flutter build apk --release --split-per-abi
          --split-debug-info=build/symbols
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ github.run_number }}

      - name: Sign and name the APKs
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)"
          OUTDIR="build/app/outputs/flutter-apk"
          mkdir -p dist

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing with the release keystore from repository secrets."
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"
            KS_ALIAS="$KEY_ALIAS"
            export KS_PASS="$KEYSTORE_PASSWORD"
            export K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No signing secrets found: using debug signing."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            KS=""
          fi

          COUNT=0
          for IN in "$OUTDIR"/app-*-release.apk; do
            [ -e "$IN" ] || continue
            ABI="$(basename "$IN" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            OUT="dist/tally-${VERSION}-${ABI}.apk"
            if [ -n "$KS" ]; then
              "$BUILD_TOOLS/apksigner" sign \
                --ks "$KS" --ks-key-alias "$KS_ALIAS" \
                --ks-pass env:KS_PASS --key-pass env:K_PASS \
                --out "$OUT" "$IN"
            else
              cp "$IN" "$OUT"
              # Flutter's default Android setup signs release builds with the
              # debug key. If a build is somehow unsigned, sign it with a
              # throwaway debug key so it still installs.
              if ! "$BUILD_TOOLS/apksigner" verify "$OUT" > /dev/null 2>&1; then
                if [ ! -f "$RUNNER_TEMP/debug.jks" ]; then
                  keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" \
                    -storepass android -keypass android -alias androiddebugkey \
                    -keyalg RSA -keysize 2048 -validity 10000 \
                    -dname "CN=Android Debug,O=Android,C=US"
                fi
                "$BUILD_TOOLS/apksigner" sign \
                  --ks "$RUNNER_TEMP/debug.jks" --ks-key-alias androiddebugkey \
                  --ks-pass pass:android --key-pass pass:android \
                  --out "$OUT.signed" "$OUT"
                mv "$OUT.signed" "$OUT"
              fi
            fi
            "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
            COUNT=$((COUNT + 1))
          done
          rm -f "$RUNNER_TEMP/release.jks"
          if [ "$COUNT" -eq 0 ]; then
            echo "No APKs were built." >&2
            exit 1
          fi
          echo "Signed $COUNT APKs:"
          ls -l dist

      # Shows where the bytes go. Look at the run summary page.
      - name: Size report
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, zipfile
          print("## APK sizes\n")
          print("| File | Size |\n| --- | --- |")
          for f in sorted(glob.glob("dist/*.apk")):
              print(f"| {os.path.basename(f)} | {os.path.getsize(f) / 1048576:.1f} MB |")
          arm = sorted(glob.glob("dist/*arm64-v8a.apk"))
          if arm:
              z = zipfile.ZipFile(arm[0])
              rows = sorted(z.infolist(), key=lambda i: i.compress_size, reverse=True)[:12]
              print(f"\n### Largest files inside {os.path.basename(arm[0])}\n")
              print("| Entry | Stored | Original |\n| --- | --- | --- |")
              for i in rows:
                  print(f"| `{i.filename}` | {i.compress_size / 1048576:.2f} MB | {i.file_size / 1048576:.2f} MB |")
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: tally-apk
          path: dist/*.apk
          if-no-files-found: error

      # Needed to read crash stack traces from this exact build
      # (flutter symbolize). Not attached to the release.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: tally-symbols
          path: build/symbols
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history, so the release notes can see every commit since the last tag.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: tally-apk
          path: dist

      # Only this job sees the API key. Without it (or if the request fails)
      # the notes fall back to a plain list of commits.
      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          SIGNING: ${{ needs.build.outputs.signing }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGELOG_MODEL: ${{ vars.CHANGELOG_MODEL }}
        run: python3 tool/release_notes.py notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its APK and notes."
            gh release upload "$TAG" dist/*.apk --clobber --repo "$REPO"
            gh release edit "$TAG" --notes-file notes.md --repo "$REPO"
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$REPO" \
              --target "$SHA" \
              --title "Tally $TAG" \
              --notes-file notes.md
          fi
